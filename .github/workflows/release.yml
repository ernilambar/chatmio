name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: Build macOS arm64
    # Only Apple silicon is supported; this is also the architecture the bundle
    # scripts verify, so a misconfigured runner fails instead of shipping an
    # unusable Intel build.
    runs-on: macos-15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      - name: Check tag matches version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The version lives in wails.json, which also feeds the bundle's
          # Info.plist. A tag that disagrees must not publish.
          version="$(plutil -extract info.productVersion raw -o - wails.json)"
          if [ -z "$version" ]; then
            echo "wails.json has no info.productVersion" >&2
            exit 1
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match wails.json version $version" >&2
            exit 1
          fi
          app_name="$(plutil -extract info.productName raw -o - wails.json)"
          if [ -z "$app_name" ]; then
            echo "wails.json has no info.productName" >&2
            exit 1
          fi
          echo "APP_NAME=$app_name" >> "$GITHUB_ENV"

      - name: Build
        run: ./scripts/bundle.sh

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$APP_NAME-macos-arm64.zip"
          bundle="$APP_NAME.app"
          notes="macOS on Apple silicon (arm64) only. Intel Macs are not supported.

          The app is signed ad hoc only (no Developer ID), so Gatekeeper quarantines it after download:

          \`\`\`sh
          unzip $archive
          xattr -dr com.apple.quarantine $bundle
          mv $bundle /Applications/
          open /Applications/$bundle
          \`\`\`"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$notes" \
            "dist/$archive" dist/SHA256SUMS
